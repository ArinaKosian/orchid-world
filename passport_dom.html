<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Паспорт — DOM</title>

    <style type="text/css">
      body {
        background-image: url("passport_shablon.png");
        background-position: center top;
        background-repeat: no-repeat;
      }

      .passgiven {
        padding-left: 610px;
        padding-top: 59px;
      }

      .passgiventime {
        padding-left: 595px;
        padding-top: 50px;
      }

      .fio {
        padding-left: 690px;
        padding-top: 186px;
      }

      .name {
        padding-left: 678px;
        padding-top: 28px;
      }

      .s_name {
        padding-left: 690px;
        padding-top: 3px;
      }

      .date_b {
        padding-left: 678px;
        padding-top: 4px;
      }

      .img {
        position: absolute;
        left: 549px;
        top: 375px;
      }

      .btn {
        position: absolute;
        left: 549px;
        top: 550px;
      }
    </style>
  </head>

  <body>
    <h2 style="position: absolute; left: 20px; top: 20px">
      Получение данных паспорта через DOM
    </h2>

    <div class="passgiven">ГУ МВД РОССИИ ПО Г. МОСКВЕ</div>

    <div class="passgiventime">23.06.2023</div>

    <div class="fio">Косян</div>

    <div class="name">Ирина</div>

    <div class="s_name">Кареновна</div>

    <div class="date_b">
      Жен &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
      25.09.<span id="birth_year">2007</span>
    </div>

    <img
      class="img"
      src="photo_passport.png"
      height="140"
      width="110"
      alt="Фото паспорта"
    />

    <button class="btn" id="change">Заменить</button>

    <button id="show_data" style="position: absolute; left: 549px; top: 580px">
      Показать данные
    </button>

    <script src="change.js"></script>
  </body>
</html>
